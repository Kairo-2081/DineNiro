# Render Blueprint for DineNiro: one Node web service in Singapore, next to the Neon database.
# JWT_SECRET and the first admin's password are generated by Render and never stored in the repo.
# DATABASE_URL is entered once when the Blueprint is first applied (sync: false).
services:
  - type: web
    name: dineniro
    runtime: node
    region: singapore
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: DINENIRO_ADMIN_PASSWORD
        generateValue: true
      - key: DINENIRO_ADMIN_EMAIL
        value: 2405010@ugrad.cse.buet.ac.bd
